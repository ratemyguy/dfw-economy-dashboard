name: Monthly data refresh

# Re-downloads the BLS and FRED series, rebuilds docs/data/dashboard.json and commits
# the result. GitHub Pages serves docs/, so the live dashboard updates on its own.
# No secrets: the BLS v1 API and FRED's graph CSV need no key.

on:
  schedule:
    # 15:00 UTC on the 12th of every month. By then BLS has usually published the
    # metro-area jobs and unemployment data for earlier months; a release that comes
    # later (for example CPI or the quarterly FHFA house price index) is picked up by the next run.
    - cron: "0 15 12 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pandas and requests
        run: python -m pip install -r requirements-ci.txt

      # fetch.py never fails the job on a data outage: it keeps the previous data for any
      # source that fails, prints a ::warning:: annotation and exits 0.
      - name: Fetch BLS and FRED data
        run: python -I src/fetch.py

      # transform.py rewrites dashboard.json only when the data changed.
      - name: Rebuild the dashboard data
        run: python -I src/transform.py

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/processed
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
